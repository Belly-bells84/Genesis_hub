; Doit être >= à la limite de 5 Mo vérifiée dans config/upload.php.
; On laisse une petite marge pour ne pas bloquer la requête AVANT
; même que le code applicatif ait pu renvoyer un message d'erreur propre.
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M

; Cache les erreurs PHP à l'écran (jamais de détails techniques exposés
; à un visiteur), tout en les gardant dans les logs pour vous
display_errors = Off
log_errors = On
error_log = /var/log/apache2/php_errors.log