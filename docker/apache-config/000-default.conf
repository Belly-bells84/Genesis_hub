<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        # AllowOverride All : indispensable pour que le .htaccess racine
        # (routing vers index.php?url=$1) ET celui d'asset/IMG/uploads/
        # (blocage d'exécution de scripts) soient réellement appliqués.
        # L'image php:apache par défaut est en "AllowOverride None".
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>