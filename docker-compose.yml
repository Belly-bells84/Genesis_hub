services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: genesis_social_network
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Montage du code en développement : toute modification locale
      # est reflétée immédiatement. En production, retirez ce volume
      # et décommentez le COPY dans le Dockerfile à la place.
      - ./:/var/www/html
      # Volume nommé séparé pour les uploads : les photos survivent
      # même si vous reconstruisez l'image de l'app (docker compose build)
      - uploads_data:/var/www/html/asset/IMG/uploads
    # Pas de bloc "environment" pour les identifiants DB ici : votre
    # config/env_loader.php lit lui-même .env puis .env.dev (ou
    # .env.prod) directement depuis les fichiers montés dans le
    # conteneur via le volume ci-dessous, et écrase toute variable
    # d'environnement Docker avec putenv() à chaque requête. Les
    # définir ici aussi n'aurait aucun effet réel et prêterait à
    # confusion. Voir .env.dev.example pour les vraies valeurs.
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: genesis_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Tout fichier .sql déposé ici est exécuté automatiquement, dans
      # l'ordre alphabétique, MAIS uniquement au tout premier démarrage
      # (volume db_data vide). Si votre base existe déjà, voir la note
      # plus bas pour appliquer la migration manuellement.
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    ports:
      # Exposé sur l'hôte uniquement pour le confort de développement
      # (se connecter avec un client MySQL local). À retirer en prod.
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: genesis_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASS}
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
  uploads_data: